<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily AI Papers</title>
  <style>
    :root{--ink:#20201e;--muted:#65635e;--paper:#fbfaf6;--rule:#d9d5ca;--accent:#7a302c;--field:#f5f0e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 Georgia,serif}.wrap{max-width:920px;margin:auto;padding:72px 28px}h1,h2{line-height:1.12}h1{font-size:3rem;margin:0 0 .3rem}h2{font-size:1.55rem;margin:0}.lede,.meta{color:var(--muted)}.catalog-tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.65rem;margin:2.3rem 0 0;padding:1rem 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}.catalog-tools label{display:block;font:600 .72rem/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.catalog-tools input,.catalog-tools select{width:100%;margin-top:.35rem;padding:.65rem .7rem;border:1px solid #a9a39a;border-radius:0;background:var(--field);color:var(--ink);font:16px Georgia,serif}.catalog-tools input:focus-visible,.catalog-tools select:focus-visible{outline:3px solid #b1734d;outline-offset:2px}.results{margin:1rem 0 -1rem;color:var(--muted);font-size:.9rem}.lesson{display:grid;grid-template-columns:126px 1fr;gap:26px;margin-top:2.5rem;padding:1.55rem 0;border-top:1px solid var(--rule)}.lesson[hidden]{display:none}.date{padding-top:5px;color:var(--accent);font:600 .78rem/1.3 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.paper-title{color:inherit;text-decoration:none}.paper-title:hover h2{text-decoration:underline;text-decoration-color:var(--accent)}.tag{font:600 .75rem/1.2 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}.button{display:inline-block;margin-top:.5rem;padding:.55rem .8rem;border:1px solid var(--accent);color:var(--accent);font:600 .78rem/1 Arial,sans-serif;letter-spacing:.05em;text-decoration:none;text-transform:uppercase}.button:hover{background:var(--accent);color:#fff}a:focus-visible{outline:3px solid #b1734d;outline-offset:3px}@media(max-width:650px){.wrap{padding:42px 20px}h1{font-size:2.4rem}.catalog-tools{grid-template-columns:1fr}.lesson{grid-template-columns:1fr;gap:8px}.date{padding-top:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="tag">A growing study collection</p><h1>Daily AI Papers</h1><p class="lede">Long-form, offline-ready lessons for building durable intuition across machine learning.</p>
    <form class="catalog-tools" role="search" onsubmit="return false">
      <label>Search papers<input id="paper-search" type="search" placeholder="Title, author, topic…" autocomplete="off"></label>
      <label>Filter by topic<select id="topic-filter"><option value="all">All topics</option><option value="graphs">Graph machine learning</option><option value="generative">Generative modeling</option><option value="regularization">Regularization</option><option value="post-training">Post-training</option><option value="optimization">Optimization</option><option value="normalization">Normalization</option><option value="language">Language modeling</option><option value="vision">Computer vision</option><option value="reinforcement">Reinforcement learning</option></select></label>
      <label>Sort<select id="sort-order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option></select></label>
    </form>
    <p id="results" class="results" aria-live="polite"></p>
    <section id="lesson-list" aria-label="Paper lessons"></section>
  </main>
  <script src="catalog.js"></script>
  <script>
    (() => {
      const catalog = window.DAILY_PAPER_CATALOG;
      const search = document.querySelector('#paper-search');
      const filter = document.querySelector('#topic-filter');
      const sort = document.querySelector('#sort-order');
      const list = document.querySelector('#lesson-list');
      const results = document.querySelector('#results');
      if (!Array.isArray(catalog)) { results.textContent = 'The lesson catalog could not be loaded.'; return; }
      const dateLabel = date => new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(`${date}T00:00:00`));
      const card = record => {
        const article = document.createElement('article'); article.className = 'lesson'; article.dataset.date = record.date; article.dataset.topic = record.topic; article.dataset.search = record.search;
        const time = document.createElement('time'); time.className = 'date'; time.dateTime = record.date; time.textContent = dateLabel(record.date);
        const content = document.createElement('div');
        const tag = document.createElement('p'); tag.className = 'tag'; tag.textContent = `${record.topicLabel} · 60 minutes`;
        const paper = document.createElement('a'); paper.className = 'paper-title'; paper.href = record.paperFile;
        const title = document.createElement('h2'); title.textContent = record.title; paper.append(title);
        const meta = document.createElement('p'); meta.className = 'meta'; meta.textContent = `${record.authors} · ${record.venue}`;
        const lesson = document.createElement('a'); lesson.className = 'button'; lesson.href = record.lessonFile; lesson.textContent = 'Open lesson →';
        content.append(tag, paper, meta, lesson); article.append(time, content); return article;
      };
      const cards = catalog.map(card);
      const update = () => {
        const query = search.value.trim().toLowerCase(); const topic = filter.value; const order = sort.value;
        const sorted = [...cards].sort((a, b) => order === 'title' ? a.querySelector('h2').textContent.localeCompare(b.querySelector('h2').textContent) : order === 'oldest' ? a.dataset.date.localeCompare(b.dataset.date) : b.dataset.date.localeCompare(a.dataset.date));
        sorted.forEach(item => { item.hidden = !((topic === 'all' || item.dataset.topic === topic) && (!query || item.dataset.search.includes(query))); list.append(item); });
        const count = cards.filter(item => !item.hidden).length; results.textContent = `${count} ${count === 1 ? 'lesson' : 'lessons'} found`;
      };
      search.addEventListener('input', update); filter.addEventListener('change', update); sort.addEventListener('change', update); update();
    })();
  </script>
</body>
</html>
